<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menedżer Kontaktów</title>
    <link rel="stylesheet" href="css/fontawesome.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <i class="fas fa-address-book"></i>
            <span>ContactHub</span>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-item active" data-view="all">
                <i class="fas fa-users"></i>
                <span>Kontakty</span>
            </a>
            <a href="#" class="nav-item" data-view="favorites">
                <i class="fas fa-star"></i>
                <span>Ulubione</span>
            </a>
            <a href="#" class="nav-item" data-view="recent">
                <i class="fas fa-clock"></i>
                <span>Ostatnie</span>
            </a>
        </nav>
    </div>

    <div class="main-content">
        <header>
            <div class="header-left">
                <h1>Kontakty</h1>
                <p class="subtitle">Zarządzaj wszystkimi kontaktami w jednym miejscu</p>
            </div>
            <button id="addNewBtn" class="btn-primary">
                <i class="fas fa-plus"></i>
                Nowy kontakt
            </button>
        </header>

        <div class="controls">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Wyszukaj kontakt...">
            </div>

            <div class="filter-box">
                <i class="fas fa-filter"></i>
                <select id="sortSelect">
                    <option value="default">Sortuj</option>
                    <option value="firstName">Imię (A-Z)</option>
                    <option value="lastName">Nazwisko (A-Z)</option>
                    <option value="age">Wiek</option>
                </select>
            </div>

            <button id="searchBtn" class="btn-icon">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>

        <div id="loader" class="loader hidden">
            <i class="fas fa-spinner fa-spin"></i>
            <span>Ładowanie danych...</span>
        </div>
        <div id="errorMsg" class="error-msg hidden"></div>

        <div id="contactsList" class="contacts-list"></div>
    </div>

    <div id="contactModal" class="modal hidden">
        <div class="modal-content">
            <button class="close"><i class="fas fa-times"></i></button>
            <h2 id="modalTitle">Dodaj nowy kontakt</h2>

            <form id="contactForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName"><i class="fas fa-user"></i> Imię*</label>
                        <input type="text" id="firstName" required minlength="2">
                    </div>

                    <div class="form-group">
                        <label for="lastName"><i class="fas fa-user"></i> Nazwisko*</label>
                        <input type="text" id="lastName" required minlength="2">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email*</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> Telefon*</label>
                    <input type="tel" id="phone" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age"><i class="fas fa-birthday-cake"></i> Wiek</label>
                        <input type="number" id="age" min="1" max="120">
                    </div>

                    <div class="form-group">
                        <label for="company"><i class="fas fa-building"></i> Firma</label>
                        <input type="text" id="company">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn-secondary">
                        <i class="fas fa-times"></i> Anuluj
                    </button>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-check"></i> Zapisz
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
